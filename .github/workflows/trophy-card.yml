name: Trophy card

on:
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:

jobs:
  trophy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: ryo-ma/github-profile-trophy@master
        with:
          username: ${{ github.repository_owner }}
          output_path: assets/trophies.svg
          token: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
          theme: onedark

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/trophies.svg
          git diff --staged --quiet || (git commit -m "chore: refresh trophy card" && git push)
