name: Streak card

on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

concurrency:
  group: profile-card-push
  cancel-in-progress: false

jobs:
  streak:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch streak SVG
        run: |
          # the service serves error cards with HTTP 200, so retry on content
          for attempt in 1 2 3 4 5; do
            if curl -sSfL --max-time 120 -o streak.new.svg \
                 "https://streak-stats.demolab.com/?user=${{ github.repository_owner }}&hide_border=true&theme=onedark" \
               && grep -q "Current Streak" streak.new.svg; then
              mv streak.new.svg assets/streak.svg
              exit 0
            fi
            echo "attempt $attempt: no valid streak card"
            if [ "$attempt" -lt 5 ]; then sleep 30; fi
          done
          echo "::warning::streak-stats returned no valid card after 5 attempts; keeping the existing one"

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/streak.svg
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "chore: refresh streak card"
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase --autostash origin main
          done
          exit 1
